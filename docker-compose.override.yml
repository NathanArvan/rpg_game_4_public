services:

  postgres:
    ports:
      - "5432:5432"
    mem_limit: 256m
    mem_reservation: 128m
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/pg_hba_dev.conf:/etc/postgresql/pg_hba_dev.conf:ro
    command: >
      postgres
      -c shared_buffers=64MB
      -c effective_cache_size=128MB
      -c work_mem=4MB
      -c maintenance_work_mem=16MB
      -c max_connections=20
      -c hba_file=/etc/postgresql/pg_hba_dev.conf

  redis:
    mem_limit: 96m
    volumes: []
    command: >
      redis-server
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no

  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Seeded dice (the E2E tests' seed): each round's rolls depend only on the seed and the round
      # number, so a replayed battle rolls the same. Remove this line for random dice.
      Dice__Seed: "1"
      DOTNET_gcServer: "0"
      DOTNET_GCConserveMemory: "9"
      DOTNET_GCRetainVM: "0"
      DOTNET_TieredPGO: "1"
    mem_limit: 512m
    mem_reservation: 256m
    volumes:
      - ./server/src:/src/src

  client:
    mem_limit: 64m