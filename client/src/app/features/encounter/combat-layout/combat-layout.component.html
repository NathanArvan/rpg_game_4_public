<div class="combat-layout">
  <div class="col-left">
    <app-quick-battle-panel [joinCode]="joinCode"></app-quick-battle-panel>
    <app-combat-sidebar [isGm]="isGm" [joinCode]="joinCode"></app-combat-sidebar>
  </div>
  <div class="col-center">
    <app-round-banner></app-round-banner>
    <app-grid [joinCode]="joinCode" [myUserId]="myUserId" [isGm]="isGm"></app-grid>
    <app-encounter-result [isGm]="isGm"></app-encounter-result>
  </div>
  <div class="col-right">
    <app-feed></app-feed>
  </div>
</div>
