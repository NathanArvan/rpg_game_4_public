<div class="grid-wrapper">

    <!-- Grid -->
  <div class="grid-container">
    <div class="board">
      <div
        class="grid"
        [style.grid-template-columns]="gridColumns$ | async">
        <div
          *ngFor="let cell of cells$ | async"
          class="cell"
          [attr.data-x]="cell.x"
          [attr.data-y]="cell.y"
          [class.in-range]="isInRange(cell)"
          [class.ghost]="isGhostTarget(cell)"
          [class.enemy-ghost]="isEnemyGhostTarget(cell)"
          (click)="onCellClick(cell)">
          <span class="ghost-step" *ngIf="!tokenAt(cell) && ghostStep(cell) as step">{{ step }}</span>
        </div>
      </div>

      <!-- Tokens sit in their own layer so they glide between cells during playback. -->
      <div class="token-layer">
        <div
          *ngFor="let token of tokens; trackBy: trackToken"
          class="token"
          [attr.data-x]="token.x"
          [attr.data-y]="token.y"
          [style.transform]="tokenTransform(token)"
          [style.transition-duration]="tokenTransitionDurations"
          [class.my-token]="isMine(token.combatant)"
          [class.selected-token]="isSelected(token.combatant)"
          [class.planned-token]="controlsSeveral && hasPlan(token.combatant)"
          [class.defeated-token]="isShownDefeated(token.combatant)"
          [class.targeted-token]="isTargeted(token.combatant)"
          [title]="tokenTitle(token.combatant)"
          (click)="onTokenClick(token)">
          {{ token.combatant.characterName[0] }}
          <span
            *ngFor="let aura of aurasFor(token.combatant.id); trackBy: trackKey; let i = index"
            class="aura aura-{{ aura.kind }}"
            [style.inset.px]="-(3 + i * 4)"
            [style.animation-duration.ms]="auraMs"></span>
        </div>

        <!-- Floating damage / MISS text -->
        <div
          *ngFor="let f of floats; trackBy: trackKey"
          class="float"
          [style.transform]="floatTransform(f)"
          [style.transition-duration]="floatTransitionDuration">
          <span class="float-text float-{{ f.kind }}" [style.animation-duration.ms]="floatMs">{{ f.text }}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Planning phase action bar (players only) -->
  <div class="action-bar" *ngIf="(isPlanning$ | async) && !isGm">
    <div class="planning-for" *ngIf="controlsSeveral && selected as current">
      Planning for <strong>{{ current.characterName }}</strong>
      <span class="hint">(click one of your tokens to switch)</span>
    </div>
    <div class="action-buttons">
      <span class="ap-budget" *ngIf="selected" [class.ap-spent]="apUsed >= maxAp"
            [title]="'Moves left this round: ' + moveCellsLeft + ' cells'">
        AP {{ apUsed }}/{{ maxAp }}
      </span>
      <button
        class="action-btn"
        [class.active]="hasDefendPlanned"
        [disabled]="lockedIn || !canAffordDefend"
        (click)="planDefend()">
        🛡 Defend
      </button>
      <button
        class="lock-in-btn"
        [disabled]="plannedCount === 0 || lockedIn"
        (click)="onLockIn()">
        {{ lockInLabel }}
      </button>
    </div>
    <div class="planned-action-display" *ngIf="selectedPlan.length">
      Planned: <strong>{{ plannedActionSummary }}</strong>
      <span *ngIf="!lockedIn" class="cancel-link undo-link" (click)="undoLast()">(undo)</span>
      <span *ngIf="!lockedIn && selectedPlan.length > 1" class="cancel-link clear-link" (click)="clearPlan()">(clear)</span>
    </div>
    <div class="timer" *ngIf="timerSeconds$ | async as secs" [class.urgent]="(secs ?? 0) < 10">
      ⏱ {{ secs }}s
    </div>
  </div>

  <!-- GM bottom bar: enemy control + force resolve -->
  <div class="gm-bottom-bar" *ngIf="(isPlanning$ | async) && isGm">
    <app-gm-enemy-planner [joinCode]="joinCode"></app-gm-enemy-planner>
    <button class="force-btn" (click)="onForceResolve()">⚡ Force Resolve</button>
  </div>
</div>
