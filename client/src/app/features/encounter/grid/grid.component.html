<div class="grid-wrapper">

    <!-- Grid -->
  <div class="grid-container">
    <div
      class="grid"
      [style.grid-template-columns]="gridColumns$ | async">
      <div
        *ngFor="let cell of cells$ | async"
        class="cell"
        [attr.data-x]="cell.x"
        [attr.data-y]="cell.y"
        [class.in-range]="isInRange(cell)"
        [class.ghost]="isGhostTarget(cell)"
        [class.enemy-ghost]="isEnemyGhostTarget(cell)"
        (click)="onCellClick(cell)">
        <div
          *ngIf="tokenAt(cell) as combatant"
          class="token"
          [class.my-token]="isMine(combatant)"
          [class.selected-token]="isSelected(combatant)"
          [class.planned-token]="controlsSeveral && hasPlan(combatant)"
          [class.defeated-token]="combatant.isDefeated"
          [class.defeating-token]="isDefeating(combatant)"
          [class.targeted-token]="isTargeted(combatant)"
          [title]="combatant.characterName + ' (HP: ' + combatant.currentHp + '/' + combatant.maxHp + ')'">
          {{ combatant.characterName[0] }}
        </div>
        <!-- Damage numbers overlay -->
        <div
          *ngFor="let dmg of damageNumbersAt(cell)"
          class="damage-number"
          [class.damage-hit]="dmg.isHit"
          [class.damage-miss]="!dmg.isHit">
          {{ dmg.text }}
        </div>
      </div>
    </div>
  </div>

  <!-- Planning phase action bar (players only) -->
  <div class="action-bar" *ngIf="(isPlanning$ | async) && !isGm">
    <div class="planning-for" *ngIf="controlsSeveral && selected as current">
      Planning for <strong>{{ current.characterName }}</strong>
      <span class="hint">(click one of your tokens to switch)</span>
    </div>
    <div class="action-buttons">
      <button
        class="action-btn"
        [class.active]="plannedActionType === 'defend'"
        (click)="planDefend()">
        🛡 Defend
      </button>
      <button
        class="lock-in-btn"
        [disabled]="plannedCount === 0 || lockedIn"
        (click)="onLockIn()">
        {{ lockInLabel }}
      </button>
    </div>
    <div class="planned-action-display" *ngIf="selectedPlan.length">
      Planned: <strong>{{ plannedActionSummary }}</strong>
      <span *ngIf="!lockedIn" class="cancel-link" (click)="cancelPlan()">(cancel)</span>
    </div>
    <div class="timer" *ngIf="timerSeconds$ | async as secs" [class.urgent]="(secs ?? 0) < 10">
      ⏱ {{ secs }}s
    </div>
  </div>

  <!-- GM bottom bar: enemy control + force resolve -->
  <div class="gm-bottom-bar" *ngIf="(isPlanning$ | async) && isGm">
    <app-gm-enemy-planner [joinCode]="joinCode"></app-gm-enemy-planner>
    <button class="force-btn" (click)="onForceResolve()">⚡ Force Resolve</button>
  </div>

  <!-- Resolving indicator -->
  <div class="resolving-banner" *ngIf="isResolving$ | async">
    Resolving...
  </div>


</div>
