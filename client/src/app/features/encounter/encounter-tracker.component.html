<div class="encounter-tracker">
  <ul class="lock-in-list" *ngIf="isPlanning$ | async">
    <li *ngFor="let name of lockedIn$ | async">
      ✓ {{ name }}
    </li>
    <li *ngIf="!(lockedIn$ | async)?.length" class="waiting">Waiting for players to lock in...</li>
  </ul>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>HP</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of combatants$ | async"
          [class.defeated]="c.isDefeated"
          [class.mine]="isMine(c)"
          [class.selected]="isMine(c) && isSelected(c)"
          (click)="select(c)">
        <td>
          <strong [class.strikethrough]="c.isDefeated">{{ c.characterName }}</strong>
          <span *ngIf="c.profileName" class="profile-name" [title]="'Moves ' + c.movementRange + ' · ' + c.maxAp + ' AP'">{{ c.profileName }}</span>
        </td>
        <td>
          <span *ngIf="!c.isDefeated">{{ c.currentHp }}/{{ c.maxHp }}</span>
        </td>
        <td>
          <span *ngIf="c.isDefeated" class="defeated-label">DEFEATED</span>
          <span *ngIf="!c.isDefeated && isLockedIn(c)" class="locked-in-badge">✓ Ready</span>
        </td>
      </tr>
    </tbody>
  </table>
</div>
