<div class="encounter-tracker">
  <ul class="lock-in-list" *ngIf="isPlanning$ | async">
    <li *ngFor="let name of lockedIn$ | async">
      ✓ {{ name }}
    </li>
    <li *ngIf="!(lockedIn$ | async)?.length" class="waiting">Waiting for players to lock in...</li>
  </ul>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>HP</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of combatants$ | async"
          [class.defeated]="statusOf(c).status === 'dead'"
          [class.out]="isShownDefeated(c)"
          [class.mine]="isMine(c)"
          [class.selected]="isMine(c) && isSelected(c)"
          (click)="select(c)">
        <td>
          <strong [class.strikethrough]="statusOf(c).status === 'dead'">{{ c.characterName }}</strong>
          <span *ngIf="c.profileName" class="profile-name" [title]="'Moves ' + c.movementRange + ' · ' + c.maxAp + ' AP'">{{ c.profileName }}</span>
          <span *ngFor="let cd of cooldownsOf(c)" class="cooldown-chip"
                [title]="cd.name + ': ready in ' + cd.left + (cd.left === 1 ? ' round' : ' rounds')">⏳ {{ cd.name }} {{ cd.left }}</span>
        </td>
        <td>
          <span *ngIf="statusOf(c).status !== 'dead'">{{ hpOf(c) }}/{{ c.maxHp }}</span>
        </td>
        <td>
          <ng-container [ngSwitch]="statusOf(c).status">
            <span *ngSwitchCase="'downed'" class="status-label downed-label"
                  [title]="'Bleeding out: dies at the end of round ' + (statusOf(c).bleedoutRoundsLeft) + ' from now unless an adjacent ally stabilizes them'">
              DOWN ({{ statusOf(c).bleedoutRoundsLeft }})
            </span>
            <span *ngSwitchCase="'stable'" class="status-label stable-label" title="Stabilized: out of this fight, but no longer dying">STABLE</span>
            <span *ngSwitchCase="'dead'" class="defeated-label">DEAD</span>
          </ng-container>
          <span *ngIf="!isShownDefeated(c) && isLockedIn(c)" class="locked-in-badge">✓ Ready</span>
        </td>
      </tr>
    </tbody>
  </table>
</div>
