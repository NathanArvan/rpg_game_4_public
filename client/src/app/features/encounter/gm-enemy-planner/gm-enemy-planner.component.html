<div class="enemy-planner">
  <h3>Enemy Control</h3>

  <!-- Enemy Planning Panel (planning phase only) -->
  <ng-container *ngIf="isPlanning$ | async">
    <div class="enemies-header">
      <span>Enemies</span>
      <span *ngIf="gmSelectedEnemyId$ | async as selId" class="selection-hint">
        Click a cell or token on the grid to plan
      </span>
    </div>

    <div class="enemy-list">
      <div
        *ngFor="let enemy of monsters$ | async"
        class="enemy-row"
        [class.selected]="(gmSelectedEnemyId$ | async) === enemy.id">

        <div class="enemy-info" (click)="onSelectEnemy(enemy.id)">
          <span class="enemy-name">{{ enemy.characterName }}</span>
          <span class="enemy-hp">{{ enemy.currentHp }}/{{ enemy.maxHp }} HP</span>
        </div>

        <div class="enemy-plan-badge skips" *ngIf="skips(enemy) as reason" [title]="reason">
          ⛔ skips this round
        </div>
        <div class="enemy-plan-badge" *ngIf="getPlan(enemy.id) as plan" [title]="apLabel(enemy)">
          {{ queueSummary(plan) }}
        </div>
        <div class="enemy-plan-badge ai" *ngIf="!skips(enemy) && !getPlan(enemy.id) && enemy.isAiControlled"
             title="The enemy AI has planned and locked in this monster. Plan it yourself to override this round.">
          🤖 AI
        </div>
        <div class="enemy-plan-badge empty" *ngIf="!skips(enemy) && !getPlan(enemy.id) && !enemy.isAiControlled">
          (will defend)
        </div>

        <app-ability-bar
          *ngIf="(gmSelectedEnemyId$ | async) === enemy.id"
          class="enemy-abilities"
          [combatant]="enemy"
          [queue]="getPlan(enemy.id) ?? []"
          [apCosts]="apCosts"
          [armedAbilityId]="armedAbilityId"
          [disabled]="lockedIn"
          (toggle)="toggleAbility($event)"></app-ability-bar>

        <div class="enemy-actions">
          <button class="defend-btn" (click)="onDefend(enemy)" title="Add Defend">
            🛡
          </button>
          <button
            class="clear-btn"
            *ngIf="getPlan(enemy.id)"
            (click)="onClearPlan(enemy.id)"
            title="Clear plan">
            ✕
          </button>
        </div>
      </div>

      <div class="no-enemies" *ngIf="(monsters$ | async)?.length === 0">
        No enemies. Add one above.
      </div>
    </div>

    <button
      class="lock-in-enemies-btn"
      [disabled]="lockedIn"
      (click)="onLockInEnemies()">
      {{ lockedIn ? 'Enemies Locked In ✓' : 'Lock In Enemies' }}
    </button>
  </ng-container>
</div>
