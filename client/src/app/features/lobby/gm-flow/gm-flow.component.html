<div class="gm-section">
  <h2>Game Master</h2>

  <div *ngIf="!gmCampaignId">
    <input [(ngModel)]="campaignName" placeholder="Campaign name" />
    <button (click)="createCampaign()">Create Campaign</button>
    <p *ngIf="gmError" class="error">{{ gmError }}</p>
  </div>

  <div *ngIf="gmCampaignId && !gmJoinCode">
    <p>Campaign created! ID: <code>{{ gmCampaignId }}</code></p>
    <button (click)="startSession()">Start Session</button>
    <p *ngIf="gmError" class="error">{{ gmError }}</p>
  </div>

  <div *ngIf="gmJoinCode && !gmConnected">
    <p>Session started! Share this join code with players:</p>
    <div class="join-code">{{ gmJoinCode }}</div>
    <button (click)="connectAsGm()">Connect to Session</button>
    <p *ngIf="gmError" class="error">{{ gmError }}</p>
  </div>

  <div *ngIf="gmConnected">
    <div class="join-code">{{ gmJoinCode }}</div>

    <div class="add-monster-row">
      <input
        type="text"
        [(ngModel)]="newMonsterName"
        placeholder="Monster name"
        (keyup.enter)="addMonster()" />
      <button (click)="addMonster()" [disabled]="!newMonsterName.trim()">
        + Add Monster
      </button>
      <label class="ai-toggle">
        <input type="checkbox" [(ngModel)]="newMonsterAi" />
        🤖 AI controls this monster
      </label>
    </div>

    <div class="monster-list" *ngIf="(monsters$ | async)?.length">
      <div class="monster-item" *ngFor="let m of monsters$ | async">
        <span class="monster-name">{{ m.characterName }}</span>
        <span class="ai-badge" *ngIf="m.isAiControlled" title="Planned by the enemy AI">🤖 AI</span>
        <span class="monster-hp">{{ m.currentHp }}/{{ m.maxHp }} HP</span>
      </div>
    </div>

    <button
      (click)="startEncounter()"
      [disabled]="playerCount === 0"
      class="encounter-btn">
      Start Encounter
    </button>
    <p *ngIf="encounterError" class="error">{{ encounterError }}</p>
  </div>
</div>
