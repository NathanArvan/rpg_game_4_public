services:

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rpg_game
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d rpg_game"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/nathanarvan/rpg-api:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=rpg_game;Username=${DB_USER};Password=${DB_PASSWORD}"
      Redis__ConnectionString: redis:6379
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: rpg-game
      Jwt__Audience: rpg-game-client
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    image: ghcr.io/nathanarvan/rpg-client:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:4201:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
